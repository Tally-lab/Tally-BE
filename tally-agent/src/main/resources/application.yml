spring:
  application:
    name: tally-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4o
          max-tokens: 4096
    mcp:
      client:
        enabled: true
        name: tally-agent
        version: 3.0.0
        request-timeout: 30s
        type: SYNC
        sse:
          connections:
            github-mcp:
              url: http://localhost:8081

server:
  port: 8080

logging:
  level:
    com.devpulse: DEBUG
    org.springframework.ai: DEBUG
