spring:
  application:
    name: tally-agent
  ai:
    openai:
      api-key: ${OPEN_AI_KEY:}
      chat:
        options:
          model: gpt-4o
          max-tokens: 4096
      embedding:
        options:
          model: text-embedding-3-small
    mcp:
      client:
        enabled: true
        name: tally-agent
        version: 3.0.0
        request-timeout: 120s
        type: SYNC
        toolcallback:
          enabled: true
        sse:
          connections:
            github-mcp:
              url: http://localhost:8081
#            k8s-mcp:
#              url: http://localhost:8082
#            monitor-mcp:
#              url: http://localhost:8083

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID:}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:5174/auth/callback}

report:
  frontend-url: ${REPORT_FRONTEND_URL:http://localhost:5174}

server:
  port: 8080

logging:
  level:
    com.devpulse: DEBUG
    org.springframework.ai: DEBUG
