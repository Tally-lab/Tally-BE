---
apiVersion: v1
kind: Service
metadata:
  name: tally-agent
  namespace: devpulse
  labels:
    app: tally-agent
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
  selector:
    app: tally-agent

