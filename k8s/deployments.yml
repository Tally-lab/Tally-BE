  name: tally-mcp-k8s
  namespace: devpulse
  labels:
    app: tally-mcp-k8s
    app.kubernetes.io/part-of: devpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tally-mcp-k8s
  template:
    metadata:
      labels:
        app: tally-mcp-k8s
    spec:
      serviceAccountName: devpulse-k8s-sa
      containers:
        - name: tally-mcp-k8s
          image: devpulse/tally-mcp-k8s:latest
          ports:
            - containerPort: 8082
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 20
            periodSeconds: 10

